<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Oficina de Visão Computacional com Amazon Rekognition</title>
  <desc id="desc">Arte institucional para o evento do AWS Student Builder Group at UFAC em parceria com a LASI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="34%" r="55%">
      <stop offset="0" stop-color="#ff4dde" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff4dde" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M84 0H0V84" fill="none" stroke="#647184" stroke-opacity=".42" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <g fill="#ff4dde">
    <rect x="0" y="252" width="84" height="84"/>
    <rect x="168" y="84" width="84" height="84"/>
    <rect x="840" y="0" width="84" height="84"/>
    <rect x="924" y="924" width="84" height="84"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="84" y="118" font-size="34" font-weight="700" letter-spacing="3">AWS STUDENT BUILDER GROUP AT UFAC × LASI</text>
    <text x="84" y="316" font-size="42" fill="#ff4dde" font-weight="800" letter-spacing="5">OFICINA PRÁTICA</text>
    <text x="84" y="420" font-size="86" font-weight="800">VISÃO</text>
    <text x="84" y="508" font-size="86" font-weight="800">COMPUTACIONAL</text>
    <text x="84" y="608" font-size="52" font-weight="500">e reconhecimento facial</text>
    <text x="84" y="678" font-size="52" font-weight="500">na nuvem com</text>
    <text x="84" y="774" font-size="72" fill="#ff4dde" font-weight="800">AMAZON REKOGNITION</text>

    <text x="84" y="928" font-size="30" fill="#bfc7d5" font-weight="700" letter-spacing="3">29 AGO 2026 · 08:00–12:00</text>
    <text x="84" y="982" font-size="30" fill="#bfc7d5">Universidade Federal do Acre · Rio Branco</text>

    <text x="84" y="1110" font-size="26" fill="#ff4dde" font-weight="800" letter-spacing="2">IA · CLOUD · COMPUTER VISION</text>
    <text x="84" y="1170" font-size="28" fill="#fff">Amazon Rekognition · S3 · Lambda · Kinesis</text>
  </g>

  <g transform="translate(820 1060)" fill="none" stroke="#ff4dde" stroke-width="12">
    <rect x="0" y="0" width="136" height="136" rx="20"/>
    <path d="M34 68h68M68 34v68"/>
    <circle cx="68" cy="68" r="22"/>
  </g>
</svg>
